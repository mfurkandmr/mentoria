<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- Uygulamanın yayımlandığı klasör: `flutter build web --base-href /app/`
       (tool/web/build_web.py). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mentoria: koç destekli YKS takip ve istatistik paneli.">
  <!-- Panel arama motorlarına kapalı; tanıtım sayfası sitenin kökünde. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#122B4B">

  <!-- iOS: ana ekrana eklenince tam ekran açılır. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mentoria">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mentoria</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F6F8FC; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #122B4B; transition: opacity .25s ease;
    }
    #splash img { width: 88px; height: 88px; border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,.12); }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px;
      background: rgba(18,43,75,.12); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%;
      border-radius: 2px; background: #F5A623; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0A1633; }
      #splash { color: #F4F1FF; }
      #splash .bar { background: rgba(255,255,255,.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
  <!-- Flutter motoru yüklenene kadar görünen açılış ekranı
       (flutter_bootstrap.js kaldırır). -->
  <div id="splash" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar" role="progressbar" aria-label="Mentoria yükleniyor"></div>
    <noscript>Mentoria'yı kullanmak için tarayıcınızda JavaScript açık olmalı.</noscript>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
