name: mentoria
description: "Mentoria - YKS öğrencileri için koç destekli takip ve istatistik uygulaması."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^3.6.1
  audioplayers: ^6.8.1
  excel: ^4.0.6
  file_picker: ^13.1.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    # Avatar parçaları: assets/avatar/<kategori>/<asset_adı>.svg
    - assets/avatar/hair/
    - assets/avatar/skin/
    - assets/avatar/outfit/
    - assets/avatar/accessory/
    # Başarı sıralaması ödülleri (taç, kanatlar)
    - assets/avatar/reward/
    # Uygulamaya özel sesler (üretici: tool/make_sounds.py)
    - assets/sounds/

# Uygulama ikonları: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#5B4BC8"
  adaptive_icon_foreground: "assets/brand/icon/adaptive_foreground.png"
  web:
    generate: true
    image_path: "assets/brand/icon/app_icon.png"
    background_color: "#FFF8DE"
    theme_color: "#FFC531"
